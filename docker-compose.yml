services:

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: fleetmanager-postgres
    environment:
      POSTGRES_DB: fleetmanager
      POSTGRES_USER: fleetmanager
      # Secrets lus dans .env (non versionné) : copier .env.example en .env et remplir.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Définir POSTGRES_PASSWORD dans .env}
    # Joignable depuis la machine seulement (outils locaux). Docker contourne le pare-feu de
    # l'hôte : publier sur 0.0.0.0 exposerait la base à Internet.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleetmanager -d fleetmanager"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── API ────────────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fleetmanager-api
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=fleetmanager;Username=fleetmanager;Password=${POSTGRES_PASSWORD:?Définir POSTGRES_PASSWORD dans .env}"
      JwtSettings__Secret: ${JWT_SECRET:?Définir JWT_SECRET dans .env (32 caractères minimum)}
      # Même durée que le cookie et que la liste noire de déconnexion.
      JwtSettings__ExpiryMinutes: "15"
      JwtSettings__Issuer: "FleetManagerApi"
      JwtSettings__Audience: "FleetManagerClient"
      # Front et API partagent la même origine derrière le relais : Lax protège mieux du CSRF.
      Auth__CookieSameSite: "Lax"
      # Comptes de démonstration publics : données remises à zéro chaque nuit (4 h UTC).
      Demo__ResetEnabled: "true"
      Demo__ResetHourUtc: "4"
    # Seul Caddy, sur la même machine, joint l'API : le contrôle du secret du relais ne peut pas
    # être contourné en appelant directement le port.
    ports:
      - "127.0.0.1:5000:8080"
    mem_limit: 512m
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
