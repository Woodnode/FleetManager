name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# Le jeton de la CI ne fait que lire le dépôt : une action compromise ne peut rien pousser.
permissions:
  contents: read

jobs:
  # ─── Backend ─────────────────────────────────────────────────────────────────
  backend:
    name: Backend — build & test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "10.x"

      - name: Restore
        run: dotnet restore FleetManager.sln

      # Échoue dès qu'un paquet, direct ou transitif, a une vulnérabilité connue.
      - name: Dépendances vulnérables
        run: |
          dotnet list FleetManager.sln package --vulnerable --include-transitive | tee vulnerable.txt
          ! grep -q " > " vulnerable.txt

      - name: Build
        run: dotnet build FleetManager.sln --no-restore -c Release

      - name: Test
        run: dotnet test FleetManager.sln --no-build -c Release --logger "trx;LogFileName=results.trx" --results-directory ./TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-test-results
          path: ./TestResults/*.trx

  # ─── Noyau de l'application mobile ──────────────────────────────────────────
  # Client de l'API, session et règles de l'app MAUI : un simple net10.0, sans workload MAUI.
  mobile-core:
    name: Mobile — tests du noyau
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "10.x"

      - name: Test
        run: dotnet test mobile/AutoNexusMobile.Tests -c Release

  # ─── Migrations PostgreSQL ───────────────────────────────────────────────────
  # Les tests tournent sur SQLite : ce job vérifie que les migrations s'appliquent
  # réellement sur PostgreSQL et qu'aucun changement de modèle n'a été oublié.
  migrations:
    name: Migrations — PostgreSQL
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fleetmanager
          POSTGRES_USER: fleetmanager
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fleetmanager -d fleetmanager"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      CONNECTION: "Host=localhost;Port=5432;Database=fleetmanager;Username=fleetmanager;Password=ci-only-password"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "10.x"

      - name: Install dotnet-ef
        run: dotnet tool install --global dotnet-ef --version "10.*"

      - name: No pending model changes
        run: dotnet ef migrations has-pending-model-changes --project src/FleetManager.Infrastructure --startup-project src/FleetManager.Api

      - name: Apply migrations
        run: dotnet ef database update --project src/FleetManager.Infrastructure --startup-project src/FleetManager.Api --connection "$CONNECTION"

  # ─── Frontend ────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend — lint, typecheck & test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Dépendances vulnérables
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test
